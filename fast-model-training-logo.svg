<svg class="h-12 w-auto" viewBox="0 0 920 92" role="img" aria-label="Fast Model Training" xmlns="http://www.w3.org/2000/svg">
    <text
        x="148"
        y="67.14"
        font-family="Inter, Poppins, Montserrat, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="82"
        font-weight="600"
        fill="var(--fast-model-training-logo-text, #0b23a9)">Fast Model Training</text>

    <!-- Fast：渐变闪电 -->
    <path
        d="M78 0 22 26h26L30 38l56-28H62z"
        fill="url(#fast-model-training-logotype-gradient)"></path>

    <!-- Model Training：神经网络节点 -->
    <circle
        cx="30"
        cy="64"
        r="26"
        fill="var(--fast-model-training-logo-mark, #0b23a9)"></circle>
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M30 50 18 74h24z"></path>
    </g>
    <circle cx="30" cy="50" r="4.5" fill="#ffffff"></circle>
    <circle cx="18" cy="74" r="4.5" fill="#ffffff"></circle>
    <circle cx="42" cy="74" r="4.5" fill="#ffffff"></circle>

    <defs>
        <linearGradient id="fast-model-training-logotype-gradient" x1="30" y1="0" x2="30" y2="38"
            gradientUnits="userSpaceOnUse">
            <stop stop-color="var(--fast-model-training-logo-gradient-start, #09dbf0)"></stop>
            <stop offset="1" stop-color="var(--fast-model-training-logo-gradient-end, #0b23a9)"></stop>
        </linearGradient>
    </defs>
</svg>
